name: Code Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new commit on the same PR supersedes its own earlier run. Different PRs
# never cancel each other because refs/pull/<N>/merge is unique per PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only. Nothing here writes to the repo, opens issues, or publishes.
permissions:
  contents: read

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # persist-credentials: false keeps GITHUB_TOKEN out of .git/config.
      # `npm ci` below runs dependency install scripts, which would otherwise
      # be arbitrary code sitting next to a readable token. Nothing here
      # pushes, so the credential is not needed.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The gate. `--max-warnings=0` is in the lint script, so any finding at
      # any severity exits non-zero and fails the check.
      - name: Lint
        run: npm run lint

      # Formatting is mechanical, so it is checked rather than argued about in
      # review. `--check` only reports and never writes, so CI cannot smuggle a
      # reformat into a branch.
      - name: Format check
        run: npm run format:check

      # Conditional: backend/ is not committed yet. Once backend/package.json
      # and tsconfig.json land, this step starts enforcing on its own.
      - name: Backend type check
        run: |
          if [ ! -f backend/tsconfig.json ]; then
            echo "backend/tsconfig.json not present, skipping"
            exit 0
          fi
          if [ ! -f backend/package.json ]; then
            echo "backend/tsconfig.json exists but package.json does not, skipping"
            exit 0
          fi
          # npm ci requires a lockfile and fails without one. Skip rather than
          # fail if the backend lands one file at a time.
          if [ ! -f backend/package-lock.json ] && [ ! -f backend/npm-shrinkwrap.json ]; then
            echo "no backend lockfile, skipping"
            exit 0
          fi
          cd backend
          npm ci
          npx tsc --noEmit

      # Runs after the type check, which has already installed backend deps.
      # Skips rather than fails when there are no tests, matching the step
      # above, so this cannot break a checkout that lands files gradually.
      - name: Backend tests
        run: |
          if [ ! -f backend/package.json ]; then
            echo "no backend/package.json, skipping"
            exit 0
          fi
          # find, not a ** glob: globstar is off in CI's bash, where ** behaves
          # as a single *, so a glob would only see tests exactly one directory
          # below src and would skip silently once any sit deeper.
          if [ -z "$(find backend/src -name '*.test.ts' 2>/dev/null)" ]; then
            echo "no backend tests, skipping"
            exit 0
          fi
          cd backend
          npm test

      # Guards against a dependency tree being committed. .gitignore covers
      # node_modules, but a forced add or a stale index would slip past it.
      - name: Reject committed dependencies
        run: |
          TRACKED=$(git ls-files | grep -E '(^|/)node_modules/' || true)
          if [ -n "$TRACKED" ]; then
            echo "node_modules is tracked in git. Remove it before merging:"
            echo "$TRACKED" | head -20
            exit 1
          fi
          echo "no tracked node_modules"
